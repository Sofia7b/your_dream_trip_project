<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/quiz.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <title>Your Dream Trip</title>
  </head>
  <body>
    <header>
      <div id="menu-bar" class="fas fa-bars"></div>
      <a href="#" class="logo"><span>T</span>ravel</a>

      <nav class="navbar">
        <a href="#home">Головна</a>
        <a href="#book">Бронювання</a>
        <a href="#packages">Пакети</a>
        <a href="#services">Послуги</a>
        <a href="#gallery">Галерея</a>
        <a href="#review">Відгуки</a>
        <a href="#contact">Контакти</a>
      </nav>

      <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="login-btn"></i>
      </div>

      <form action="" class="search-bar-container">
        <input type="search" id="search-bar" placeholder="Пошук..." />
        <label for="search-bar" class="fas fa-search"></label>
      </form>
    </header>

    <div class="login-form-container">
      <i class="fas fa-times" id="form-close"></i>
      <form action="">
        <h3>Увійти</h3>
        <input type="email" class="box" placeholder="Електронна пошта" />
        <input type="password" class="box" placeholder="Пароль" />
        <input type="submit" value="Увійти" class="btn" />
        <input type="checkbox" id="remember" />
        <label for="remember">Запам'ятати мене</label>
        <p>Забули пароль? <a href="#">Відновити</a></p>
        <p>Немає акаунта? <a href="#">Реєстрація</a></p>
      </form>
    </div>

    <div class="quiz-main">
      <div class="quiz-wrapper">
        <div class="quiz-container" id="quiz">
          <div class="quiz-header">
            <p id="number" class="number-numeration"></p>
            <h2 id="question" class="question-text"></h2>
          </div>
          <div id="answers" class="answers-quiz"></div>
        </div>
        <div class="quiz-result" id="result">
          <div class="result-content">
            <img
              class="result-image"
              id="quiz-result-image"
              alt="Результат квізу"
            />
            <div class="result-links"></div>
          </div>
        </div>

        <div class="restart-container">
          <button id="restart-btn" class="restart-btn">
            Спробувати ще раз
          </button>
        </div>
      </div>
    </div>

    <script src="js/quiz_with_generator.js"></script>
  </body>
</html>
